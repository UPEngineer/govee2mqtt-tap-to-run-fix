name: Govee to MQTT Bridge (Tap-to-Run fix)
# No "image:" line, so Home Assistant builds this add-on locally from the Dockerfile.
version: "2026.11.11-tap-to-run-fix"
slug: govee2mqtt_patched
description: govee2mqtt with the Tap-to-Run account-token patch (wez/govee2mqtt#737)
url: https://github.com/wez/govee2mqtt/issues/737
arch:
  - amd64
  - aarch64
init: false
startup: services
services:
  - mqtt:need

apparmor: true

webui: http://[HOST]:[PORT:8056]/assets/index.html

# Host network access is required for LAN discovery
host_network: true

map:
  - type: addon_config
    read_only: false
    path: /app/config

options:
  temperature_scale: "F"

schema:
  temperature_scale: "str?"
  govee_email: "str?"
  govee_password: "password?"
  govee_api_key: "password?"
  mqtt_host: "str?"
  mqtt_port: "int?"
  mqtt_username: "str?"
  mqtt_password: "password?"
  debug_level: "str?"
  no_multicast: "bool?"
  broadcast_all: "bool?"
  global_broadcast: "bool?"
  scan: "str?"
